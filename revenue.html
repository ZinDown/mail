<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Audience Network Report</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e8f5e9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        h1 {
            color: #388e3c;
            text-align: center;
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        #fb-login-container {
            text-align: center;
            margin-bottom: 20px;
        }
        #fb-login-button {
            padding: 12px 20px;
            background-color: #388e3c;
            color: white;
            font-size: 1.2rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #fb-login-button:hover {
            background-color: #2c6e2f;
        }
        .report {
            display: none;
        }
        label {
            font-size: 1.2rem;
            color: #388e3c;
            display: block;
            margin-bottom: 10px;
        }
        select {
            padding: 12px 18px;
            font-size: 1rem;
            border: 2px solid #388e3c;
            border-radius: 15px;
            width: 100%;
            background-color: #f1f8e9;
            margin-bottom: 20px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .card {
            padding: 20px;
            background-color: rgba(0, 128, 255, 0.1); /* Default color with low opacity (blue) */
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card p {
            font-size: 2rem;
            font-weight: bold;
            color: #388e3c;
            margin: 0;
        }
        .card span {
            font-size: 1rem;
            color: #388e3c;
            margin-top: 10px;
            display: block;
        }

        /* Specific colors for each card */
        .card.revenue { background-color: rgba(0, 128, 255, 0.1); } /* Blue */
        .card.impressions { background-color: rgba(255, 99, 71, 0.1); } /* Red */
        .card.requests { background-color: rgba(34, 139, 34, 0.1); } /* Green */
        .card.fillRate { background-color: rgba(255, 165, 0, 0.1); } /* Orange */
        .card.clicks { background-color: rgba(238, 130, 238, 0.1); } /* Violet */
        .card.ecpm { background-color: rgba(255, 223, 0, 0.1); } /* Yellow */
    </style>
</head>
<body>

<div class="container">
    <h1>Facebook Audience Network </h1>

    <div id="fb-login-container">
        <button id="fb-login-button" onclick="loginWithFacebook()">Login with Facebook</button>
    </div>

    <div class="report" id="report-container">
        <label for="time-period">Select Time Period:</label>
        <select id="time-period">
            <option value="Today">Today</option>
            <option value="Yesterday">Yesterday</option>
            <option value="Last 7 Days">Last 7 Days</option>
            <option value="Last Month">Last Month</option>
            <option value="This Month">This Month</option>
            <option value="This Year">This Year</option>
            <option value="Last 1 Year">Last 1 Year</option>
        </select>

        <div class="grid-container">
            <!-- Revenue Card -->
            <div class="card revenue">
                <p id="revenue">-</p>
                <span>Revenue</span>
            </div>

            <!-- Impressions Card -->
            <div class="card impressions">
                <p id="impressions">-</p>
                <span>Impressions</span>
            </div>

            <!-- Requests Card -->
            <div class="card requests">
                <p id="requests">-</p>
                <span>Requests</span>
            </div>

            <!-- Fill Rate Card -->
            <div class="card fillRate">
                <p id="fillRate">-</p>
                <span>Fill Rate</span>
            </div>

            <!-- Clicks Card -->
            <div class="card clicks">
                <p id="clicks">-</p>
                <span>Clicks</span>
            </div>

            <!-- eCPM Card -->
            <div class="card ecpm">
                <p id="ecpm">-</p>
                <span>eCPM</span>
            </div>
        </div>
    </div>
</div>

<script>
    window.fbAsyncInit = function() {
        FB.init({
            appId      : '804912209952900', // Replace with your Facebook App ID
            cookie     : true,
            xfbml      : true,
            version    : 'v16.0'
        });
    };

    (function(d, s, id) {
        var js, fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s); js.id = id;
        js.src = "https://connect.facebook.net/en_US/sdk.js";
        fjs.parentNode.insertBefore(js, fjs);
    }(document, 'script', 'facebook-jssdk'));

    // Custom Login Button Function
    function loginWithFacebook() {
        FB.login(function(response) {
            if (response.authResponse) {
                console.log('Login successful:', response);
                document.getElementById('fb-login-container').style.display = 'none';
                document.getElementById('report-container').style.display = 'block';
                fetchReport('Today');
            } else {
                console.log('Login failed:', response);
                alert('User cancelled login or did not fully authorize.');
            }
        }, {scope: 'ads_management,ads_read,pages_show_list'});
    }

    function fetchReport(timePeriod) {
        FB.api('/me', { fields: 'id,name,accounts' }, function(response) {
            console.log('Facebook User Data:', response);
            if (response && response.accounts) {
                const account = response.accounts.data[0];
                const accessToken = FB.getAuthResponse().accessToken;
                const adAccountId = account.id;

                const apiUrl = `https://graph.facebook.com/v16.0/act_${adAccountId}/insights`;
                const { since, until } = getTimePeriodDateRange(timePeriod);

                fetch(`${apiUrl}?access_token=${accessToken}&time_range[start_date]=${since}&time_range[end_date]=${until}&fields=requests,impressions,clicks,ecpm,fill_rate,revenue`)
                    .then(response => response.json())
                    .then(data => {
                        console.log('Report Data:', data);
                        const report = data.data[0];
                        document.getElementById('revenue').innerText = report.revenue || '-';
                        document.getElementById('impressions').innerText = report.impressions || '-';
                        document.getElementById('requests').innerText = report.requests || '-';
                        document.getElementById('fillRate').innerText = report.fill_rate || '-';
                        document.getElementById('clicks').innerText = report.clicks || '-';
                        document.getElementById('ecpm').innerText = report.ecpm || '-';
                    })
                    .catch(error => {
                        console.error('Error fetching data:', error);
                        alert('Failed to fetch report data.');
                    });
            }
        });
    }

    function getTimePeriodDateRange(timePeriod) {
        let since, until;
        const today = new Date();

        switch (timePeriod) {
            case 'Today':
                since = until = today.toISOString().split('T')[0];
                break;
            case 'Yesterday':
                today.setDate(today.getDate() - 1);
                since = until = today.toISOString().split('T')[0];
                break;
            case 'Last 7 Days':
                const sevenDaysAgo = new Date(today.setDate(today.getDate() - 7));
                since = sevenDaysAgo.toISOString().split('T')[0];
                until = new Date().toISOString().split('T')[0];
                break;
            case 'Last Month':
                today.setMonth(today.getMonth() - 1);
                since = today.toISOString().split('T')[0];
                until = new Date().toISOString().split('T')[0];
                break;
            case 'This Month':
                today.setDate(1);
                since = today.toISOString().split('T')[0];
                until = new Date().toISOString().split('T')[0];
                break;
            case 'This Year':
                today.setMonth(0);
                today.setDate(1);
                since = today.toISOString().split('T')[0];
                until = new Date().toISOString().split('T')[0];
                break;
            case 'Last 1 Year':
                today.setFullYear(today.getFullYear() - 1);
                since = today.toISOString().split('T')[0];
                until = new Date().toISOString().split('T')[0];
                break;
        }
        return { since, until };
    }
</script>

</body>
</html>
